<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>비플페이 가맹점 현장조사 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <aside id="panel" class="panel">
      <div class="panel-top">
        <a class="brand" href="/" title="비플페이 조사 지도"><span class="brand-mark">B</span></a>
        <form id="search-form" class="search" autocomplete="off">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search-input" type="search" placeholder="지역 이름 (예: 동성로, 대구 중구 삼덕동)" enterkeyhint="search">
          <button type="button" id="search-clear" class="search-clear" aria-label="지우기" hidden>×</button>
        </form>
        <a class="stats-link" href="/stats">통계</a>
      </div>
      <div id="recent-chips" class="recent-chips" aria-label="최근 검색" hidden></div>

      <div id="panel-body" class="panel-body">
        <section id="home" class="home">
          <div class="daegu">
            <h2 class="section-title">대구 지역 바로가기</h2>
            <div id="gu-tabs" class="gu-tabs" role="tablist"></div>
            <div id="dong-list" class="dong-list"></div>
          </div>
          <div class="view-head">
            <h2 class="view-title">지도 화면 안 식당</h2>
            <p id="view-stats" class="region-stats"></p>
          </div>
        </section>

        <section id="status" class="status" hidden>
          <div id="status-collecting" hidden>
            <p class="status-title">네이버 지도에서 수집 중…</p>
            <p class="muted">30초~3분 걸립니다. 넓은 동은 더 걸릴 수 있습니다. <span class="dots"><i></i><i></i><i></i></span></p>
          </div>
          <div id="status-failed" hidden>
            <p id="status-error" class="status-error"></p>
            <div id="suggestions" class="suggestions" hidden>
              <p class="muted">AI가 제안하는 더 좁은 지역</p>
              <div id="suggestion-list" class="suggestion-list"></div>
            </div>
            <button id="retry-btn" type="button" class="btn-retry">다시 시도</button>
          </div>
        </section>

        <section id="region" class="region" hidden>
          <div id="region-head" class="region-head">
            <h2 id="region-name" class="region-name"></h2>
            <p id="region-source" class="muted"></p>
            <p id="region-ai" class="region-ai" hidden></p>
            <p id="region-excluded" class="region-excluded" hidden></p>
            <div id="cat-filter" class="cat-filter" hidden>
              <span id="cat-filter-label"></span>
              <button type="button" id="cat-filter-off" aria-label="업종 필터 끄기">×</button>
            </div>
            <p id="region-stats" class="region-stats"></p>
          </div>
        </section>

        <div id="places" class="places" hidden>
          <div id="filter-chips" class="chips" role="tablist">
            <button type="button" class="chip is-active" data-filter="all">전체 <b class="chip-n"></b></button>
            <button type="button" class="chip" data-filter="yes">가능 <b class="chip-n"></b></button>
            <button type="button" class="chip" data-filter="no">불가능 <b class="chip-n"></b></button>
            <button type="button" class="chip" data-filter="none">미조사 <b class="chip-n"></b></button>
            <button type="button" class="chip chip-near" data-sort="near" title="내 위치에서 가까운 순으로 정렬">가까운 순</button>
            <button type="button" class="chip chip-likes" data-sort="likes" title="좋아요 많은 순으로 정렬">좋아요 순</button>
          </div>
          <ul id="place-list" class="place-list"></ul>
        </div>
      </div>
      <div id="sheet-handle" class="sheet-handle" aria-hidden="true"><span></span></div>
      <div id="panel-resizer" class="panel-resizer" title="드래그해서 너비 조절" aria-hidden="true"></div>
    </aside>

    <main id="map-wrap" class="map-wrap">
      <div id="map"></div>
      <button type="button" id="btn-locate" class="btn-locate" title="내 위치로 이동">◎ 내 위치</button>
      <div id="mascot" class="mascot" aria-hidden="true">
        <div class="mascot-flip"><div class="mascot-act"><img src="/assets/cat.png" alt=""></div></div>
        <div class="mascot-fx"></div>
      </div>
      <div id="sheet" class="sheet" hidden>
        <button type="button" id="sheet-close" class="sheet-close" aria-label="닫기">×</button>
        <h3 id="sheet-name" class="sheet-name"></h3>
        <p id="sheet-category" class="muted"></p>
        <p id="sheet-address" class="sheet-address"></p>
        <p id="sheet-phone" class="sheet-phone"></p>
        <div class="sheet-actions">
          <button type="button" id="btn-yes" class="btn-survey btn-yes">비플페이 가능</button>
          <button type="button" id="btn-no" class="btn-survey btn-no">불가능</button>
        </div>
        <div class="sheet-route">
          <button type="button" id="btn-route" class="btn-route">길찾기</button>
          <span id="sheet-dist" class="muted"></span>
          <span class="sheet-react">
            <button type="button" id="btn-like" class="btn-react" title="좋아요">👍 <b id="like-count">0</b></button>
            <button type="button" id="btn-dislike" class="btn-react" title="싫어요">👎 <b id="dislike-count">0</b></button>
          </span>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/daegu.js"></script>
  <script src="/app.js"></script>
  <script src="/mascot.js"></script>
</body>
</html>
